name: CivicMesh CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas unitarias
        run: |
          pytest -v tests/

  container-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar construccion de imagen Docker
        run: |
          docker build -t civicmesh:latest .
