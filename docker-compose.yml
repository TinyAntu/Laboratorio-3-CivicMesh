version: '3.8'

networks:
  civicmesh_net:
    driver: bridge

volumes:
  civicmesh_runs:

services:
  peer0:
    build: .
    container_name: civicmesh_peer0
    hostname: peer0
    command: python -m network.peer --node-id p0 --host 0.0.0.0 --port 9000 --fanout 2 --seed 42
    ports:
      - "9000:9000"
    volumes:
      - civicmesh_runs:/app/runs
    networks:
      - civicmesh_net
    restart: unless-stopped

  peer1:
    build: .
    container_name: civicmesh_peer1
    hostname: peer1
    command: python -m network.peer --node-id p1 --host 0.0.0.0 --port 9001 --seeds-file seeds_compose.txt --fanout 2 --seed 43
    ports:
      - "9001:9001"
    depends_on:
      - peer0
    volumes:
      - civicmesh_runs:/app/runs
    networks:
      - civicmesh_net
    restart: unless-stopped

  peer2:
    build: .
    container_name: civicmesh_peer2
    hostname: peer2
    command: python -m network.peer --node-id p2 --host 0.0.0.0 --port 9002 --seeds-file seeds_compose.txt --fanout 2 --seed 44
    ports:
      - "9002:9002"
    depends_on:
      - peer0
    volumes:
      - civicmesh_runs:/app/runs
    networks:
      - civicmesh_net
    restart: unless-stopped

  publisher0:
    build: .
    container_name: civicmesh_publisher0
    hostname: publisher0
    command: python -c "import time, sys; print('[publisher0] Publicador iniciado y conectado a la malla CivicMesh...', flush=True); time.sleep(3600)"
    depends_on:
      - peer0
      - peer1
      - peer2
    volumes:
      - civicmesh_runs:/app/runs
    networks:
      - civicmesh_net
    restart: unless-stopped

  frontend:
    build: .
    container_name: civicmesh_frontend
    hostname: frontend
    command: python -c "import time, sys; print('[frontend] Servidor de estadísticas listo en puerto 8501...', flush=True); time.sleep(3600)"
    ports:
      - "8501:8501"
    volumes:
      - civicmesh_runs:/app/runs
    networks:
      - civicmesh_net
    restart: unless-stopped
